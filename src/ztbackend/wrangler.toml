[[kv_namespaces]]
binding = "POLICIES"
id = "6cde452e385842c69f7dc590e226142b"

[[kv_namespaces]]
binding="SESSIONS"
id="3fe0027ce4ec491487536270e654b2e7"

[[migrations]]
tag = "v1"
new_classes = [ "NetworkManager", "PolicyEngine" ]